<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="420" rx="28" fill="#0E1726"/>
  <rect x="32" y="32" width="1136" height="356" rx="22" fill="#142338" stroke="#31445E"/>

  <text x="64" y="78" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">AmaImagery Runtime Rhythm</text>
  <text x="64" y="110" fill="#C8D5E6" font-family="Arial, Helvetica, sans-serif" font-size="18">One contract, one lifecycle story, multiple operational surfaces.</text>

  <line x1="120" y1="224" x2="1080" y2="224" stroke="#5F7EA0" stroke-width="4" stroke-linecap="round"/>

  <circle cx="160" cy="224" r="14" fill="#E79B57"/>
  <rect x="86" y="138" width="148" height="64" rx="16" fill="#1B3048"/>
  <text x="160" y="166" fill="#FFF3E4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">API</text>
  <text x="160" y="188" fill="#C8D5E6" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Accepts jobs</text>

  <circle cx="390" cy="224" r="14" fill="#6FC3E8"/>
  <rect x="304" y="246" width="172" height="72" rx="16" fill="#1B3048"/>
  <text x="390" y="274" fill="#EAF4FF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="390" y="296" fill="#C8D5E6" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Lifecycle source of truth</text>

  <circle cx="620" cy="224" r="14" fill="#E79B57"/>
  <rect x="536" y="138" width="168" height="64" rx="16" fill="#22283A"/>
  <text x="620" y="166" fill="#FFF3E4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Worker</text>
  <text x="620" y="188" fill="#C8D5E6" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Executes queued jobs</text>

  <circle cx="850" cy="224" r="14" fill="#8FD3A5"/>
  <rect x="762" y="246" width="176" height="72" rx="16" fill="#163227"/>
