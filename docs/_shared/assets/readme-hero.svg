<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" rx="28" fill="#0C1523"/>
  <rect x="36" y="36" width="1128" height="428" rx="24" fill="#101D31" stroke="#27374D"/>

  <rect x="72" y="70" width="136" height="32" rx="16" fill="#13243A"/>
  <text x="142" y="92" fill="#EAF4FF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AmaImagery</text>

  <rect x="222" y="70" width="128" height="32" rx="16" fill="#30261B"/>
  <text x="286" y="92" fill="#F0E3D6" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">ComfyUI First</text>

  <text x="74" y="142" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Operational image generation</text>
  <text x="74" y="188" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">for teams that want control.</text>

  <text x="76" y="246" fill="#C7D2E1" font-family="Arial, Helvetica, sans-serif" font-size="19">FastAPI backend, async workers, provider-aware readiness,</text>
  <text x="76" y="272" fill="#C7D2E1" font-family="Arial, Helvetica, sans-serif" font-size="19">artifact delivery, and an operational admin surface.</text>

  <rect x="76" y="328" width="230" height="52" rx="16" fill="#E29A5C"/>
  <text x="191" y="360" fill="#0C1523" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Async API + Worker</text>

  <rect x="320" y="328" width="214" height="52" rx="16" fill="#15253A" stroke="#2A3B52"/>
  <text x="427" y="360" fill="#E7EEF8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Health + Readiness</text>

  <rect x="774" y="102" width="276" height="70" rx="18" fill="#16263D"/>
  <text x="800" y="132" fill="#F4F8FD" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Provider Runtime</text>
  <text x="800" y="154" fill="#C7D2E1" font-family="Arial, Helvetica, sans-serif" font-size="15">Boot state, polling, artifacts.</text>

  <rect x="774" y="190" width="276" height="82" rx="18" fill="#1F2534"/>
  <text x="800" y="220" fill="#F8F1E9" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Unified Contract</text>
  <text x="800" y="242" fill="#D9CCBE" font-family="Arial, Helvetica, sans-serif" font-size="15">Queued to completed, with</text>
  <text x="800" y="262" fill="#D9CCBE" font-family="Arial, Helvetica, sans-serif" font-size="15">explicit failure state.</text>

  <rect x="774" y="290" width="276" height="82" rx="18" fill="#163025"/>
  <text x="800" y="320" fill="#EEF9F2" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Inspectable By Design</text>
  <text x="800" y="342" fill="#CCE1D4" font-family="Arial, Helvetica, sans-serif" font-size="15">Status, history, admin, and</text>
  <text x="800" y="362" fill="#CCE1D4" font-family="Arial, Helvetica, sans-serif" font-size="15">downloads stay aligned.</text>
</svg>
