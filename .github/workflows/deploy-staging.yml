name: deploy-staging

on:
  workflow_run:
    workflows: [ "docker-publish" ]
    types: [ completed ]
  workflow_dispatch:

env:
  REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }} # ghcr.io or docker.io
  IMAGE_BACKEND: ${{ secrets.REGISTRY }}/genai-backend
  STAGING_COMPOSE_FILE: ${{ secrets.STAGING_COMPOSE_FILE }}
  STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
  STAGING_FRONTEND_DIR: ${{ secrets.STAGING_FRONTEND_DIR }}

jobs:
  build-frontend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Copy frontend/dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "./dist/*"
          target: "${{ env.STAGING_FRONTEND_DIR }}"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            echo "Login to registry"
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY_HOST }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin
            echo "Pull new images"
            docker compose -f "${{ env.STAGING_COMPOSE_FILE }}" --env-file "${{ env.STAGING_ENV_FILE }}" pull
            echo "Apply"
            docker compose -f "${{ env.STAGING_COMPOSE_FILE }}" --env-file "${{ env.STAGING_ENV_FILE }}" up -d --remove-orphans
            docker image prune -f || true
