name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    name: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches project version
        shell: python
        run: |
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]
          tag = "${{ github.ref_name }}"
          expected = f"v{project_version}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match project version {expected!r}")

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: version-check
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend-fast:
    name: backend-fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: version-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend fast-path dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests

      - name: MyPy
        run: python -m mypy app

      - name: Backend fast tests
        env:
          SECRET_KEY: test-secret-key-for-release
          LIMITS_ENABLED: "true"
          NO_REDIS: "true"
          DEBUG: "true"
          REFRESH_COOKIE_SECURE: "false"
        run: |
          pytest -m "not (gpu or redis or db or e2e or slow or perf)" --maxfail=1 --disable-warnings -q --no-cov

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: version-check
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend integration suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-release
          LIMITS_ENABLED: "true"
          NO_REDIS: "false"
          DEBUG: "true"
          REFRESH_COOKIE_SECURE: "false"
        run: |
          pytest tests --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60 --junitxml=pytest.xml

      - name: Upload release backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-artifacts
          path: |
            coverage.xml
            pytest.xml
          if-no-files-found: warn

  create-release:
    name: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - version-check
      - frontend
      - backend-fast
      - backend-integration
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release-assets/frontend-dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
