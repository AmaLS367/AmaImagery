services:
  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 10
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    env_file:
      - ./.env.prod
    environment:
      POSTGRES_USER: pgroot
      POSTGRES_PASSWORD: ${PGROOT_PASSWORD}
      POSTGRES_DB: appdb
      APP_DB_USER: app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE} -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ./.env.prod
    environment:
      RUN_IN_DOCKER: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      REFRESH_COOKIE_SECURE: "1"
    expose:
      - "8000"
    volumes:
      - outputs:/app/outputs
      - logs:/app/logs
      - ../frontend/dist:/app/static:ro
      - ./models:/models:ro
    depends_on:
      - redis
      - postgres
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    networks:
      - backend

  generation_worker:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ./.env.prod
    environment:
      RUN_IN_DOCKER: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    command: ["python", "-m", "app.entrypoints.generation_worker"]
    volumes:
      - outputs:/app/outputs
      - logs:/app/logs
      - ./models:/models:ro
    depends_on:
      - redis
      - postgres
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    networks:
      - backend

  nginx:
    logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "5"
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - backend

volumes:
  pgdata:
  outputs:
  logs:

networks:
  edge:
    driver: bridge
  backend:
    internal: true
