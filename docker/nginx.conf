# default.conf — production, local, offline

# Rate limit zones
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;     # login/register/forgot
limit_req_zone $binary_remote_addr zone=refresh_per_ip:10m rate=30r/m; # refresh
limit_req_zone $binary_remote_addr zone=gen_per_ip:10m rate=1r/s;       # generate
limit_req_zone $binary_remote_addr zone=file_per_ip:10m rate=30r/m;     # file download

# Connection limit zone
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Anti-DoS timeouts and sizes
client_max_body_size 25m;
client_body_timeout 10s;
send_timeout 10s;
keepalive_timeout 10s;
keepalive_requests 100;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# HTTP: health-check and redirect to HTTPS
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  # Trust real IP only from private networks
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Liveness without redirect
  location = /api/v1/healthz {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api/api/v1/healthz;
  }

  return 301 https://$host$request_uri;
}

# Upstream declared in http context
upstream api {
  server api:8000;
  keepalive 32;
}

# HTTPS: main server
server {
  listen 443 ssl http2;
  server_name _;
  server_tokens off;

  # TLS (offline: without OCSP)
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Trust real IP only from private networks
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Strict security headers
  # IMPORTANT: Enable HSTS ONLY with a valid CA certificate to avoid local lockouts.
  # add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Frontend static files
  root /usr/share/nginx/html;
  index index.html;

  # /api/v1/auth — strict rate limits
  location ^~ /api/v1/auth/refresh {
    limit_req zone=refresh_per_ip burst=10 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api/api/v1/auth/refresh;
  }

  location ^~ /api/v1/auth/ {
    limit_req zone=auth_per_ip burst=5 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api/api/v1/auth/;
  }

  # /api/v1/images/generate — strict rate and connection limits
  location ^~ /api/v1/images/generate {
    limit_req zone=gen_per_ip burst=3 nodelay;
    limit_conn perip 2;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api/api/v1/images/generate;
  }

  # /api/v1/file — moderate download rate limits
  location ^~ /api/v1/file {
    limit_req zone=file_per_ip burst=20 nodelay;
    limit_conn perip 10;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api/api/v1/file;
  }

  # Proxy pass for the rest of API
  location /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api/api/v1/;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
