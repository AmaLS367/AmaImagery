# Network & Security
protected-mode yes
port 6379

# Security Hardening (Disable dangerous commands)
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command SHUTDOWN ""
rename-command DEBUG    ""

# Memory Management (Moved from docker-compose command)
maxmemory 256mb
maxmemory-policy noeviction

# Persistence (Moved from docker-compose command)
appendonly no